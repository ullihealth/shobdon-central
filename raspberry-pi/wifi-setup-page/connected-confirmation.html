<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Connected</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #020617;
    color: #f1f5f9;
    font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    overflow: hidden;
  }
  .wrap {
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3vh;
    text-align: center;
  }
  .brand {
    font-weight: 800;
    font-size: 2.6vw;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: #f1f5f9;
    text-shadow: 0 0 40px rgba(56, 189, 248, 0.5);
  }
  .check {
    width: 11vw;
    height: 11vw;
    border-radius: 50%;
    background: rgba(74, 222, 128, 0.12);
    border: 0.2vw solid #4ade80;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .check svg { width: 5vw; height: 5vw; }
  h1 {
    margin: 0;
    font-size: 2.6vw;
    font-weight: 700;
    color: #e2e8f0;
  }
  p {
    margin: -1.6vh 0 0 0;
    font-size: 1.3vw;
    color: #94a3b8;
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="brand">Airfield Central</div>
    <div class="check">
      <svg viewBox="0 0 24 24" fill="none" stroke="#4ade80" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="20 6 9 17 4 12"></polyline>
      </svg>
    </div>
    <h1>Connected. Your Airfield Central screen is starting&hellip;</h1>
    <p>This will only take a moment</p>
  </div>
  <script>
    // Post-restart confirmation round (2026-10-16): deliberately NOT
    // shown during the hotspot-to-WiFi switch itself - two earlier
    // attempts tried that (holding kiosk.service's own restart, then
    // holding inside kiosk-wrapper.sh before launching anything) and
    // both lost the race against the browser restart that switch
    // itself requires - confirmed live, the message kept getting wiped
    // by the restart before it could ever be read. This page is only
    // ever shown AFTER a fresh connection has already fully succeeded
    // and kiosk-wrapper.sh has already relaunched into it (see that
    // file's own comment) - there's no further restart coming, so the
    // hold here is a plain client-side timer, then a normal in-page
    // navigation to the real dashboard in this SAME browser window -
    // no process restart, so nothing can race it away.
    document.documentElement.dataset.kioskRenderOk = 'true';
    setTimeout(function () {
      window.location.href = '__DASHBOARD_URL__';
    }, 10000);
  </script>
</body>
</html>
