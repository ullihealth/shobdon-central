<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <!-- Deliberately no user-scalable=no / maximum-scale lock here - native
         pinch-to-zoom and drag-to-pan must keep working on phone/tablet
         browsers. This dashboard is a fixed canvas (same layout as desktop/
         TV) that a mobile user zooms/pans into, rather than a separately
         reflowed compact mobile layout - a dedicated phase-2 mobile layout
         is a possible future improvement, out of scope for now. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shobdon Central — Weather Connectivity Test</title>
    <!-- Site-wide favicon (Airfield Central's jet icon) - covers both the
         landing page and every tenant dashboard automatically, since this
         is the one index.html shell every hostname shares. Sized set
         (16/32/48/192) plus apple-touch-icon (180) as the generic
         fallback for every route except /pilot, which overwrites this
         apple-touch-icon (and apple-mobile-web-app-title, added by
         usePilotHomeScreenMeta.ts) with the tenant's own real logo/name
         once branding data resolves - this shared shell has no way to
         know which tenant a request belongs to, so nothing tenant-
         specific can be baked in here directly. -->
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon/favicon-48.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon/favicon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon/favicon-180.png" />
    <!-- Pilot View PWA ("Add to Home Screen") - the manifest link always
         points at the dynamic per-tenant route (functions/api/public/
         manifest.json.ts), which resolves by Host header the same way
         every other public config fetch already does; harmless on every
         non-/pilot route (nothing else reads it). apple-mobile-web-app-
         capable enables standalone (chromeless) launch from iOS's home
         screen - the one iOS-specific piece a manifest alone can't
         provide. -->
    <link rel="manifest" href="/api/public/manifest.json" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
