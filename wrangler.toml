# Cloudflare Pages Functions bindings (functions/ directory) - separate from
# worker/wrangler.toml, which is the standalone capture-ingest Worker
# (manual `wrangler deploy`, untouched by this file). This one is picked
# up automatically by Cloudflare Pages on every git push, and by
# `wrangler pages dev` locally, because pages_build_output_dir is set.
name = "shobdon-central"
compatibility_date = "2026-07-10"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "dist"

[[d1_databases]]
binding = "DB"
database_name = "shobdon-central"
database_id = "31656f0d-3bf3-4c0f-96bb-39bf90c9e179"

# Media library uploads (images/mp4/pdf) for the carousel feature -
# key structure {tenant_slug}/library/{fileId}.{ext}. Public-read (r2.dev
# URL enabled via `wrangler r2 bucket dev-url enable`), same posture as
# the public dashboard itself - carousel content is dashboard content,
# not gated behind auth for reads. Uploads/deletes go through
# functions/api/tenant/media-library/* (owner/media role required).
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "shobdon-central-media"

# Short-TTL cache for third-party API responses that don't belong in D1
# (no durable/relational value - just "what did we last successfully
# fetch"). First user: functions/api/public/[tenant]/visibility-forecast.ts
# caches the Met Office hourly forecast here with a 60-minute
# expirationTtl, so the KV entry's own expiry is what enforces "never
# silently serve data past its TTL" - once it's gone, the Function must
# refetch or report unavailable, no manual staleness bookkeeping needed.
[[kv_namespaces]]
binding = "WEATHER_CACHE"
id = "c5ada3c64f1745509ed0977c0ab0c323"

[vars]
# BETTER_AUTH_URL / AUTH_TRUSTED_ORIGIN previously lived here as single
# hardcoded strings - removed. functions/api/auth/[[path]].ts now derives
# baseURL dynamically per-request (allowedHosts, wildcard-capable) and
# hardcodes trustedOrigins as a wildcard list directly in code, since
# both need to cover *.airfieldcentral.com (every current and future
# tenant subdomain) rather than a single fixed value - see that file's
# own comment for the full reasoning. If a stale BETTER_AUTH_URL/
# AUTH_TRUSTED_ORIGIN env var exists in the Cloudflare dashboard's own
# Environment Variables (separate from this file), it's harmless now -
# neither is read anywhere in the code anymore.

# Public r2.dev base URL for the MEDIA bucket above - used to construct
# public file URLs for the dashboard (functions/api/public/[tenant]/
# config.ts). Not a secret - it's already public by design.
MEDIA_PUBLIC_BASE_URL = "https://pub-49e7730844f6446db2a9bf40e27356cf.r2.dev"

# AUTH_SECRET is set via: npx wrangler pages secret put AUTH_SECRET

# Preview deployments (any git push to a non-production branch) - a
# dedicated, isolated D1 database (shobdon-central-preview), NOT
# production's. Cloudflare Pages treats a committed wrangler.toml as
# authoritative for Functions bindings on EVERY environment, silently
# overriding anything configured via the dashboard/API for either
# production or preview when there's no environment-specific section -
# confirmed the hard way setting this up: a preview deployment kept
# resolving to production's real D1 (31656f0d-...) despite the Pages
# dashboard API reporting a successful preview-only binding change,
# because the [[d1_databases]] block above has no [env.preview]
# counterpart to differ from it. This section is that counterpart -
# every future branch push now gets this same isolated database
# automatically, no per-branch setup needed. Migrated to the exact same
# schema as production via `wrangler d1 migrations apply` (all 49 files
# applied cleanly against a from-fresh, unseeded copy).
#
# WEATHER_CACHE is intentionally still shared with production here -
# it's a short-TTL third-party API response cache with no tenant-
# specific or write-meaningful content, not real data, so isolating it
# would only cost preview a cold cache with no corresponding safety
# benefit. MEDIA (R2) is deliberately NOT bound for preview - media
# library uploads/logo changes will fail there until a preview-specific
# bucket is set up; existing production media still displays fine via
# MEDIA_PUBLIC_BASE_URL below since that's a plain public URL, not an
# R2 binding. AUTH_SECRET has no [env.preview.vars] entry here (same
# posture as production above) - it's set separately via
# `wrangler pages secret put AUTH_SECRET` against the preview
# environment, never committed in plaintext.
[env.preview]

[[env.preview.d1_databases]]
binding = "DB"
database_name = "shobdon-central-preview"
database_id = "2679ff61-ddc2-422b-ae8f-9aad004a1192"

[[env.preview.kv_namespaces]]
binding = "WEATHER_CACHE"
id = "c5ada3c64f1745509ed0977c0ab0c323"

[env.preview.vars]
MEDIA_PUBLIC_BASE_URL = "https://pub-49e7730844f6446db2a9bf40e27356cf.r2.dev"
