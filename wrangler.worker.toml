# NEW Worker config for the Pages -> Workers migration - deliberately a
# separate file from wrangler.toml (which still configures the live
# Pages project, untouched, throughout this migration). Deployed via
# `wrangler deploy --config wrangler.worker.toml`, never the default
# `wrangler deploy` (which would look for wrangler.toml and find the
# Pages config instead - this explicit --config flag is what keeps the
# two projects from ever colliding).
#
# Same bindings as wrangler.toml (identical database_id/bucket_name/KV
# id) - this points at the exact same D1/R2/KV resources, not copies.
# No data migration involved, only a compute/routing layer change.
name = "airfield-central"
main = "./dist/_worker.js/index.js"
# Pinned permanently to the AirfieldCentral Cloudflare account - this
# project must never deploy against any other account (e.g. ScreenAds),
# and an explicit account_id here means wrangler never has to guess or
# prompt when the logged-in CLI user has access to more than one.
account_id = "ec1676b8ffcf5e85467e3ed04b8fdfef"
compatibility_date = "2026-07-17"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

# Wildcard DNS/Worker migration (MD FILES/Shobdon-Central-Wildcard-DNS-
# Migration-Plan.md) - prerequisite for zero-touch self-serve Stripe
# onboarding. Cloudflare Pages has no wildcard Custom Domain support
# (confirmed against current docs); Workers Routes do, natively, on any
# plan - this is the standard documented mechanism for catching every
# subdomain under a zone with one rule.
#
# Live in production: the wildcard DNS record (*.airfieldcentral.com,
# proxied CNAME) was added and this route deployed - both confirmed via
# dig/curl against a real tenant subdomain (Gyroplane Train's
# tenant-5de4rbob.airfieldcentral.com, previously unreachable, now
# resolving through this Worker).
#
# Corrected 2026-08-30 (stale for over a month - see deploy-worker.yml's
# own comment, which got this right the same day the mistake was found):
# this route is the SOLE live server for every real tenant subdomain,
# shobdon.airfieldcentral.com/demo.airfieldcentral.com/
# newcustomer.airfieldcentral.com included - NOT just Gyroplane/wildcard-
# only ones, and this used to say otherwise here. That original claim
# ("exact match wins, so Shobdon/demo/newcustomer stay on Pages") was the
# Wildcard DNS Migration Plan's own Step 4 assumption, verified live at
# cutover time - then empirically DISPROVEN that same day (commit
# 78b0e87, 2026-07-27): a Worker-only redeploy (no Pages deploy at all)
# immediately flipped what all three served, simultaneously with every
# wildcard-only tenant, which is only possible if this Worker - not
# Pages - was already answering their requests. "Exact match beats
# wildcard" is real, but only for Workers Route vs. Workers Route on the
# same zone - it doesn't extend to Workers Route vs. Pages Custom
# Domain, a different Cloudflare product, not a second entry in the same
# routing table (see MD FILES/Shobdon-Central-Wildcard-DNS-Migration-Plan.md's
# own "Update - 2026-07-27" section for the full writeup/evidence). Pages
# still lists shobdon/demo/newcustomer as attached Custom Domains -
# that's a real, active, unremoved claim, just not what's actually
# serving them; leave those claims in place (removing them risks the
# claim-propagation issue from Decision #4/Runbook 2 for no benefit).
# The bare apex (airfieldcentral.com) is the one exception, genuinely
# still Pages-served - this route's leading-label wildcard structurally
# can't match a zero-label apex. Practical consequence: a change here
# needs BOTH a Pages deploy AND this Worker redeployed (deploy-worker.yml,
# automatic on push) to reach any real tenant subdomain - Pages alone is
# only ever enough for the bare apex.
#
# Corrected 2026-10-05 (investigation round): the Pages half above is NOT
# currently automatic, despite what this comment used to say. Cloudflare
# Pages' own git-integration auto-deploy for the shobdon-central project
# has been confirmed broken since 2026-09-02 (deployment list shows zero
# production deploys - not even failed ones - for any commit after
# ab5f205, while this Worker's own deploy-worker.yml kept succeeding on
# every single push over the same window, which rules out a GitHub-side
# cause). Until that's fixed on the Cloudflare dashboard side, reaching
# the bare apex requires a manual `wrangler pages deploy dist
# --project-name=shobdon-central --branch=main` after every push - it
# will NOT happen on its own the way this Worker's own redeploy does.
[[routes]]
pattern = "*.airfieldcentral.com/*"
zone_name = "airfieldcentral.com"

[assets]
directory = "./dist"
binding = "ASSETS"
# Required explicitly here - Workers does not auto-detect SPA behaviour
# the way Pages does (no 404.html present, so Pages silently serves
# index.html for any unmatched path; Workers needs this told to it).
# Without this, every client-side route (/config, /d/main, /media-manager,
# etc. - none of which are real files in dist/) would 404 instead of
# loading the app.
not_found_handling = "single-page-application"
# Without this, Cloudflare's default asset-first routing detects real
# browser navigations (requests carrying Sec-Fetch-Mode: navigate - a
# plain <a href> click, not a fetch()/XHR call, and not sent by curl
# either) to any path with no literal file in dist/, and serves the SPA
# fallback above INSTEAD OF ever invoking this Worker's own Function
# router (main, below) - confirmed as the exact cause of "View Capture
# Logs" (a plain <a href="/api/tenant/capture-logs" target="_blank">)
# rendering the dashboard instead of the real endpoint, even though the
# address bar stayed correct and the same URL worked fine via fetch()/
# curl (neither sends that header, so neither was ever affected).
# Scoped to /api/* only - every other unmatched path (client-side routes
# like /config, /d/main, /media-manager) still falls through to the SPA
# fallback exactly as before.
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "shobdon-central"
database_id = "31656f0d-3bf3-4c0f-96bb-39bf90c9e179"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "shobdon-central-media"

[[kv_namespaces]]
binding = "WEATHER_CACHE"
id = "c5ada3c64f1745509ed0977c0ab0c323"

[vars]
MEDIA_PUBLIC_BASE_URL = "https://pub-49e7730844f6446db2a9bf40e27356cf.r2.dev"

# Stripe groundwork (Airfield Pack round, Phase B) - test mode only, same
# non-secret test-mode price ids already declared in wrangler.toml's own
# [vars] (investigation round found this file was missing them - the
# Worker, not Pages, is what actually serves every tenant subdomain's
# checkout traffic, so without these here Phase B's product-mapping
# would silently fail to resolve a product for every real tenant).
STRIPE_PRICE_PACK = "price_1UNFGQPidShgOHShVaDq5CzF"
STRIPE_PRICE_PILOT_APP = "price_1UNFGkPidShgOHSho400RtF5"
STRIPE_PRICE_MEDIA_SCREEN = "price_1UNFH3PidShgOHShe8svQZ62"

# AUTH_SECRET, MET_OFFICE_API_KEY set via:
#   npx wrangler secret put AUTH_SECRET --config wrangler.worker.toml
#   npx wrangler secret put MET_OFFICE_API_KEY --config wrangler.worker.toml
# CAPTURE_KEY intentionally not set - functions/api/tenant/capture-logs.ts
# and capture-refresh.ts both already fall back to a hardcoded value
# when env.CAPTURE_KEY is unset, matching current Pages behaviour.
